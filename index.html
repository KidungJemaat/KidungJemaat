<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kidung Jemaat - Haleluya! Pujilah!</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .player {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    .cover {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      background: url('https://via.placeholder.com/400x200?text=Kidung+Jemaat') center/cover;
      margin-bottom: 15px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }

    audio {
      width: 100%;
      outline: none;
    }

    .footer {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="player">
    
    <div class="cover"></div>

    <div class="title">001. Haleluya! Pujilah!</div>
    <div class="subtitle">Kidung Jemaat</div>

    <audio controls>
      <source src="https://raw.githubusercontent.com/KidungJemaat/KidungJemaat/main/001.%20Haleluya!%20Pujilah!.mp3" type="audio/mpeg">
      Browser tidak mendukung audio.
    </audio>

    <div class="footer">© Kidung Jemaat</div>

  </div>

</body>
</html>
